<!doctype html><html lang="ja"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{overflow:hidden}body{margin:0;background:linear-gradient(135deg,#e5f4ff,#fff7dc);color:#163047;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh}.top{display:flex;gap:10px;align-items:center;padding:13px 20px;background:#fffdf7e8;border-bottom:1px solid #d7e4e8}.brand{font-size:clamp(17px,2.5vw,27px);font-weight:800;flex:1}.top button,.action{border:0;border-radius:999px;padding:10px 15px;font-weight:800;background:#e8f2f4;color:#163047;cursor:pointer;touch-action:manipulation}.top button.on{background:#12365a;color:#fff}.screen{display:none;max-width:1450px;margin:auto;padding:14px 20px}.screen.on{display:block}.draw-grid{display:grid;grid-template-columns:minmax(0,1fr)}.stage{height:calc(100vh - 105px);min-height:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;min-width:0;position:relative;padding-top:18px;padding-bottom:96px;overflow:hidden}.stage>#drawBtn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap}.label{font-weight:800;letter-spacing:.14em;color:#5d7181;font-size:18px}.hint{font-size:18px;color:#5d7181;margin:9px}.batch-box{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #b9ccd3;border-radius:999px;padding:5px 13px;font-weight:800;position:relative;z-index:2}.batch-box input{width:70px;border:0;background:#edf5f7;border-radius:10px;font-size:27px;text-align:center;font-weight:900;padding:5px;pointer-events:auto;touch-action:manipulation}.rolling-number{font-size:clamp(230px,38vw,610px);font-weight:900;line-height:.72;letter-spacing:-.1em;color:#12365a;text-shadow:0 8px #fff,0 14px 22px #7da1b466;margin:18px 0 8px}.rolling-number.rolling{color:#177bc5}.rolling-number.stopped{color:#12365a}.action{font-size:clamp(25px,3vw,39px);padding:15px 62px;background:#ffd94d;color:#412d00;box-shadow:0 6px #cda800}.action.stop{background:#ef5a50;color:#fff;box-shadow:0 6px #ae312a}.action:disabled{opacity:.55}.results{display:none;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:9px;width:100%;max-width:1340px;margin:10px auto}.results.show{display:grid}.results.rows-3{max-height:calc(100vh - 270px);overflow:hidden}.results.rows-3{max-width:1500px;column-gap:12px;row-gap:4px}.results.rows-3 .result{font-size:min(15.5vh,9.2vw,165px);padding:10px 3px}.result{min-width:0;overflow:hidden;white-space:nowrap;background:#fffdf8;border-radius:16px;padding:16px 3px;font-size:clamp(58px,7.4vw,112px);font-weight:900;line-height:.96;color:#12365a;letter-spacing:-.065em;text-shadow:0 4px #fff,0 8px 13px #7da1b466;box-shadow:0 6px 20px #31516324}.results.cols-1 .result{font-size:clamp(170px,31vw,410px)}.results.cols-2 .result{font-size:clamp(115px,17vw,235px)}.results.cols-3 .result{font-size:clamp(82px,12vw,165px)}.results.cols-4 .result{font-size:clamp(66px,9vw,130px)}.results.rows-3 .result{height:min(calc(14.88vh + 20px),calc(8.832vw + 20px),178.4px);font-size:min(12.8vh,7.7vw,138px);padding:10px 3px;display:flex;align-items:center;justify-content:center}.card{background:#fffdf8;border-radius:24px;padding:20px;box-shadow:0 8px 28px #31516324}.card h1{margin:5px 0}.count{color:#5d7181;font-weight:700}.list{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:11px}.list li{background:#e9f4f5;border-radius:13px;text-align:center;padding:13px;font-size:32px;font-weight:900}.empty{color:#5d7181;text-align:center;padding:30px}.settings{max-width:520px;margin:35px auto}.settings input{display:block;width:100%;font-size:30px;padding:11px;border:2px solid #bed0d7;border-radius:12px;margin:10px 0 18px}.settings .action{font-size:17px;padding:12px 18px;background:#12365a;color:#fff;box-shadow:none}.sheet-link{display:block;text-align:center;text-decoration:none;margin:12px 0 4px;border-radius:14px;padding:14px 18px;background:#1f8f55;color:#fff;font-size:18px;font-weight:900}.note{background:#edf5f7;padding:13px;border-radius:12px;line-height:1.65}@media(max-width:700px){.top{padding:10px;flex-wrap:wrap}.brand{width:100%;font-size:16px}.screen{padding:12px}.stage{min-height:55vh}.rolling-number{font-size:min(64vw,360px)}.results{grid-template-columns:repeat(2,minmax(0,1fr))}.results.cols-1{grid-template-columns:1fr}.result{font-size:clamp(46px,15vw,96px)}}
</style></head><body>
<header class="top"><div class="brand">三玉保育園 夕涼み会 抽選会（まとめ引き）</div><button class="on" data-page="draw">抽選画面</button><button data-page="list">引換一覧</button><button data-page="settings">設定</button></header>
<section class="screen on" id="draw"><div class="draw-grid"><div class="stage"><div class="label">LUCKY NUMBERS</div><div class="batch-box"><span>今回引く数</span><input id="batchCount" type="number" min="1" max="15" value="1" inputmode="numeric"><span>個（最大15個）</span></div><div class="rolling-number" id="rollingNumber">?</div><div class="results" id="results"></div><div class="hint" id="hint">準備中です</div><button class="action" id="drawBtn">抽選スタート</button></div></div></section>
<section class="screen" id="list"><div class="card"><div class="label">EXCHANGE LIST</div><h1>引換番号一覧</h1><div class="count" id="count"></div><ol class="list" id="listItems"></ol><div class="empty" id="empty">まだ抽選されていません</div></div></section>
<section class="screen" id="settings"><div class="card settings"><div class="label">SETTINGS</div><h1>抽選の設定</h1><p>番号の上限</p><input id="max" type="number" min="1" max="9999" inputmode="numeric"><button class="action" id="save">上限を保存</button><hr><div class="note"><b>排除する番号の入力場所</b><br>スプレッドシートの「排除番号」タブで、A列に1行ずつ番号を入力してください。入力した番号は、このまとめ引き版の抽選対象から外れます。</div><a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1Hd_Fz7LZcQmlTPHYbiPavMpFk6RHvm2s-FNPw-q28Bw/edit" target="_blank" rel="noopener">スプレッドシートを開く</a><hr><p>誤って抽選したときは、直前の1件だけ取り消せます。</p><button class="action" id="undo">直前の番号を取り消す</button><p>テスト後・最初からやり直すとき用です。</p><button class="action" id="reset">履歴を全部消してやり直す</button></div></section>
<audio id="drumSound" loop preload="auto" src="https://raw.githubusercontent.com/eitarok/mitama-lottery-sounds/main/drum-roll.mp3"></audio><audio id="hitSound" preload="auto" src="https://raw.githubusercontent.com/eitarok/mitama-lottery-sounds/main/fanfare.mp3"></audio>
<script>
let state={max:200,excluded:[],draws:[]},rolling=false,stopping=false,timer=null,prepared=null;const $=s=>document.querySelector(s),fail=e=>alert(e.message||e);const drumSound=$('#drumSound'),hitSound=$('#hitSound'),batchInput=$('#batchCount');batchInput.disabled=false;const drum=()=>{drumSound.currentTime=0;drumSound.play().catch(()=>{})};const hit=()=>{drumSound.pause();drumSound.currentTime=0;hitSound.currentTime=0;hitSound.play().catch(()=>{})};function available(){const used=new Set([...state.draws.map(x=>x.number),...state.excluded]);const pool=[];for(let n=1;n<=state.max;n++)if(!used.has(n))pool.push(n);return pool}function showResults(numbers){const ordered=[...numbers].sort((a,b)=>a-b);const cols=ordered.length===1?1:ordered.length<=4?2:ordered.length<=6?3:ordered.length<=12?4:5;const rows=Math.ceil(ordered.length/cols);const box=$('#results');box.className=`results show cols-${cols}${rows===3?' rows-3':''}`;box.style.setProperty('--cols',cols);box.innerHTML=ordered.map(n=>`<div class="result">${n}</div>`).join('');$('#rollingNumber').hidden=true}
function render(){const d=state.draws,rest=state.max-state.excluded.length-d.length;$('#listItems').innerHTML=d.map(x=>`<li>${x.number}</li>`).join('');$('#empty').hidden=!!d.length;$('#count').textContent=`抽選済み ${d.length}件 ／ 抽選対象 ${state.max-state.excluded.length}件`;if(document.activeElement!==$('#max'))$('#max').value=state.max;if(!rolling){$('#drawBtn').disabled=rest<=0;$('#drawBtn').textContent=rest<=0?'抽選終了':'抽選スタート';$('#hint').textContent=rest<=0?'すべての番号を抽選しました':`残り ${rest} 番`}}
let loading=false;function load(){if(loading)return;loading=true;google.script.run.withSuccessHandler(x=>{loading=false;state=x;batchInput.disabled=rolling;render()}).withFailureHandler(e=>{loading=false;fail(e)}).getState()}load();setInterval(()=>{if(!rolling&&$('#list').classList.contains('on'))load()},8000);
function reservationFailed(e){rolling=false;stopping=false;prepared=null;clearInterval(timer);timer=null;batchInput.disabled=false;drumSound.pause();$('#rollingNumber').classList.remove('rolling','stopped');$('#drawBtn').classList.remove('stop');render();fail(e);load()}
function finishPrepared(){if(!prepared)return;const result=prepared;prepared=null;rolling=false;stopping=false;batchInput.disabled=false;hit();$('#rollingNumber').classList.remove('stopped');$('#drawBtn').classList.remove('stop');$('#drawBtn').disabled=true;showResults(result.numbers);$('#hint').textContent=`${result.numbers.length}個が当選！ 記録しています…`;google.script.run.withSuccessHandler(r=>{state=r.state;render();$('#hint').textContent=`${r.numbers.length}個をまとめて抽選しました！`}).withFailureHandler(e=>{reservationFailed(e)}).commitPreparedDraw(result.token)}
$('#drawBtn').onclick=()=>{const count=Number(batchInput.value),pool=available();if(!Number.isInteger(count)||count<1||count>15)return alert('引く数は1〜15で入力してください。');if(count>pool.length)return alert(`残り${pool.length}個しか抽選できません。`);if(!rolling){rolling=true;stopping=false;prepared=null;batchInput.disabled=true;drum();$('#results').className='results';$('#results').innerHTML='';$('#rollingNumber').hidden=false;$('#rollingNumber').classList.remove('stopped');$('#rollingNumber').classList.add('rolling');$('#drawBtn').textContent='ストップ';$('#drawBtn').classList.add('stop');$('#hint').textContent=`${count}個を抽選中… タップして止めてください`;timer=setInterval(()=>$('#rollingNumber').textContent=pool[Math.floor(Math.random()*pool.length)],60);google.script.run.withSuccessHandler(r=>{prepared=r;if(stopping)finishPrepared()}).withFailureHandler(reservationFailed).prepareDraw(count)}else if(!stopping){stopping=true;clearInterval(timer);timer=null;drumSound.pause();$('#rollingNumber').classList.remove('rolling');$('#rollingNumber').hidden=true;$('#drawBtn').disabled=true;$('#drawBtn').textContent='決定中…';$('#hint').textContent=prepared?'止まりました！':'止まりました。結果を準備しています…';if(prepared)finishPrepared()}};
$('#save').onclick=()=>google.script.run.withSuccessHandler(x=>{state=x;render();alert('上限を保存しました。')}).withFailureHandler(fail).saveMax($('#max').value);
$('#undo').onclick=()=>{if(confirm('直前の当選番号を取り消します。よろしいですか？'))google.script.run.withSuccessHandler(x=>{state=x;render();alert('直前の番号を取り消しました。')}).withFailureHandler(fail).undoLast()};
$('#reset').onclick=()=>{if(confirm('抽選履歴をすべて消します。よろしいですか？'))google.script.run.withSuccessHandler(x=>{state=x;$('#results').className='results';$('#results').innerHTML='';$('#rollingNumber').hidden=false;$('#rollingNumber').textContent='?';render();alert('リセットしました。')}).withFailureHandler(fail).resetAll()};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===b.dataset.page));load()});
</script></body></html>
